name: Release

# Push a tag like v0.1.0 to build everything and publish a GitHub release.
# Run it by hand (Actions → Release → Run workflow) to only build the files.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: linux-aarch64, os: ubuntu-22.04-arm }
          - { name: windows-x64, os: windows-2025 }
          - { name: windows-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: cargo build --release --locked -p megamix -p megamix-gui
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: scripts/package-linux.sh target/release
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/bin | Out-Null
          Copy-Item target/release/megamix.exe, target/release/megamix-gui.exe dist/bin/
          # Portable zip for people who don't want an installer.
          $zip = "dist/megamix-${{ matrix.name }}-portable.zip"
          Compress-Archive -Path dist/bin/*, README.md, LICENSE-MIT, LICENSE-APACHE -DestinationPath $zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/bin/*.exe
          if-no-files-found: error

  installers:
    name: Windows installers
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: artifacts
      - name: Version
        id: v
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Inno Setup
        shell: pwsh
        run: |
          # The script is written for Inno Setup 6.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version 6.7.3 -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 not found" }
          foreach ($a in @(@{arch='x64'; dir='windows-x64'}, @{arch='arm64'; dir='windows-arm64'})) {
            $bin = (Resolve-Path "artifacts/$($a.dir)/bin").Path
            & $iscc /Qp "/DArch=$($a.arch)" "/DVersion=${{ steps.v.outputs.version }}" "/DBinDir=$bin" packaging/windows/megamix.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, installers]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir -p upload
          find artifacts -name '*.tar.gz' -exec cp {} upload/ \;
          find artifacts -name '*-portable.zip' -exec cp {} upload/ \;
          find artifacts/windows-installers -name '*.exe' -exec cp {} upload/ \;
          cp packaging/linux/install.sh upload/
          (cd upload && sha256sum * > SHA256SUMS.txt)
          ls -la upload
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" upload/* \
            --title "Mega Mix+ Mod Manager ${GITHUB_REF_NAME#v}" \
            --generate-notes
