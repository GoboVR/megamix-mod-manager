[package]
name = "megamix-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
encoding_rs = "0.8.35"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
fs4 = "1.1.0"
libc = "0.2"
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.25.0"
sha2 = "0.11.0"
sysinfo = "0.40.4"
tar = "0.4"
thiserror = "2.0.21"
toml_edit = "0.25.20"
unrar = { version = "0.5.8", optional = true }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
walkdir = "2.5.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "lzma", "bzip2", "xz"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[features]
default = ["rar"]
# RAR support compiles the UnRAR C++ library (needs a C++ compiler).
rar = ["dep:unrar"]
