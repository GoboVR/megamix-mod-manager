[package]
name = "megamix-gui"
description = "GUI mod manager for Hatsune Miku: Project DIVA Mega Mix+"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["rar"]
# RAR archive support (UnRAR, C++). Off for MinGW/musl cross builds.
rar = ["megamix-core/rar"]

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
gilrs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
megamix-core = { path = "../megamix-core", default-features = false }
png = "0.18.1"
slint = { version = "1.19.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
] }

[build-dependencies]
slint-build = "1.19.0"
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
