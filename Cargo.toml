[workspace]
resolver = "3"
members = ["crates/megamix-core", "crates/megamix-cli", "crates/megamix-gui"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GoboVR/megamix-mod-manager"
rust-version = "1.95"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
